<main class="overview  grid-bg">
    <header class="overview-hero-secion ">
        <div class="hero-top-bar">
            <span class="marquee-label">Find me in</span>
            <marquee behavior="scroll" direction="left" class="hero-marquee">
                <span>GitHub :: LinkedIn :: Twitter / X :: Instagram :: Discord ::</span>
            </marquee>
        </div>

        <div class="overview-hero-section__header">
            <div class="hero-img hero-img--left">
                <img src="/src/assets/image/hero-image-removebg-preview.png" alt="">
            </div>

            <div class="hero-text-content">

                <h1 class="hero-title-hollow">BUILD ANYTHING</h1>

                <p class="hero-subtitle-bottom">
                    Adaptive builder & process-driven problem solver.
                </p>

                <div class="hero-cta-group">
                    <button class="btn btn--primary">contact me</button>
                    <button class="btn btn--primary">ready for freelance</button>
                </div>
            </div>

            <div class="hero-img hero-img--right">
                <span>Img</span>
            </div>
        </div>


    </header>
    <nav class="navbar-sticky">
        Navbar-sticky
    </nav>
    <section class="github-overview">
        <div class="github-overview__header">
            <div class="github-profile">
                <img class="github-avatar" id="github-avatar" src="" alt="">
                <a class="github-username" id="github-username" href="" target="_blank"></a>
            </div>
        </div>
        <div class="github-overview__content">
            <div class="stat-parent">
                <div class="stat-parent">
                    <div class="github-stats">
                        <div class="github-stat-card" data-stat="stars">
                            <span class="github-stat-card__number">-</span>
                            <span class="github-stat-card__label">Stars</span>
                        </div>
                        <div class="github-stat-card" data-stat="repos">
                            <span class="github-stat-card__number">-</span>
                            <span class="github-stat-card__label">Repositories</span>
                        </div>
                        <div class="github-stat-card" data-stat="contributions">
                            <span class="github-stat-card__number">-</span>
                            <span class="github-stat-card__label">Contributions</span>
                        </div>

                        <div class="github-stat-card" data-stat="projects">
                            <span class="github-stat-card__number">1</span>
                            <span class="github-stat-card__label">Projects Completed</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="github-calendar__parent">
                <p class="github-overview__desc">My contribution activity on GitHub</p>
                <div class="github-calendar"></div>
            </div>
        </div>

    </section>
    <section class="project-section">

    </section>
    <section class="skill-section">

    </section>
    <section class="tech-stack_section">

    </section>
    <section class="tools-section">

    </section>
