<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kurniawan</title>
    <link rel="stylesheet" href="style/file-korban.css">
    <link rel="stylesheet" href="style/layout.css">
    <link rel="stylesheet" href="style/base/reset.css">
    <link rel="stylesheet" href="style/base/variables.css">
    <link rel="stylesheet" href="style/base/typography.css">
    <link rel="stylesheet" href="style/components/header.css">

<body>
    <!-- main parent -->
    <div class="main-parent" id="main-parent">
        <!-- header -->
        <header class="header" id="header">
            <div class="header-name">
                <svg class="header-icon">
                    <use href="assets/icon/sprite.svg#terminal-icon"></use>
                </svg>

            </div>
            <div class="three-dots">

        </header>
        <!-- end header -->
        <!-- sidebar -->
        <aside class="sidebar" id="sidebar">
            <section class="profile">
                <img src="https://avatars.githubusercontent.com/u/1103287?v=4" alt="Profile Picture"
                    class="profile-pic">
                <div class="name-n-bio">
                    <h1>KURNIAWAN</h1>
                    <p>Computer And Network Engineering student</p>
                </div>
            </section>
            <nav class="nav-bar" id="nav-bar">
                <p class="explorer">EXPLORER</p>

                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="index.html">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#home-icon"></use>
                            </svg>
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="about.html">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#about-icon"></use>
                            </svg>
                            <span>About Me</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="experience.html">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#experience-icon"></use>
                            </svg>
                            <span>Experience</span>
                        </a>
                    </li>
                    <li class="menu-item folder">
                        <button class="folder-btn">
                            <svg class="chevron">
                                <use href="assets/icon/sprite.svg#chevron"></use>
                            </svg>
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#projects-icon"></use>
                            </svg>
                            <span>Projects</span>
                        </button>
                        <ul class="project-category">
                            <li>
                                <a href="project.html">
                                    Web Development
                                </a>
                            </li>
                            <li>
                                <a href="project.html">
                                    Networking
                                </a>
                            </li>
                            <li>
                                <a href="project.html">
                                    Other
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>
        <!-- end sidebar -->
        <!-- main content -->
        <main class="editor" id="editor">
            <nav class="tab-bar" id="tab-bar">
                <!-- build in javascript -->
            </nav>
            <article class="main-content" id="main-content">
                <!-- build in javascript -->
            </article>
        </main>
        <!-- end main content -->
        <footer class="footer" id="footer">
            <div class="social-links">
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#facebook-icon"></use>
                    </svg>
                </a>
                                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#github-icon"></use>

                </a>

                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#tiktok-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#linkedin-icon"></use>
                    </svg>
                </a>
                <a href="#">
