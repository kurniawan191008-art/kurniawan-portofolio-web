<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kurniawan</title>

    <link rel="stylesheet" href="src/style/main.css">
    <link rel="stylesheet" href="src/style/pages-style/home-style.css">

</head>

<body>
    <!-- main parent -->
    <div class="main-parent" id="main-parent">
        <!-- header -->
        <header class="header" id="header">
            <div class="header-name">
                <p>DIGITAL GARDEN</p>
            </div>
            <div class="three-dots">
                <div class="green"></div>
                <div class="blue"></div>
                <div class="red"></div>
            </div>

        </header>
        <!-- end header -->
        <!-- sidebar -->
        <aside class="sidebar" id="sidebar">
            <section class="profile">
                <img src="https://avatars.githubusercontent.com/u/253683141?v=4" alt="Profile Picture"
                    class="profile-pic">
                <span></span>

                <div class="name-n-bio">
                    <h1>KURNIAWAN</h1>
                    <p>Computer And Network Engineering student</p>
                </div>
            </section>
            <nav class="nav-bar" id="nav-bar">
                <p class="explorer">EXPLORER</p>

                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="#" data-page="home">
                            <svg class="icon">
                                <use href="src/assets/icon/sprite.svg#home-icon"></use>
                            </svg>
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="#" data-page="about">
                            <svg class="icon">
                                <use href="src/assets/icon/sprite.svg#about-icon"></use>
                            </svg>
                            <span>About Me</span>
                        </a>
                    </li>
                    <li class="menu-item folder">
                        <button class="folder-btn" id="sub-menu">
                            <svg class="icon">
                                <use href="src/assets/icon/sprite.svg#projects-icon"></use>
                            </svg>
                            <span>portfolio</span>
                            <svg class="chevron">
                                <use href="src/assets/icon/sprite.svg#chevron"></use>
                            </svg>

                        </button>
                        <ul class="project-category" id="hidden-menu">
                            <li>
                                <a href="#" data-page="overview">
                                    <svg class="icon">
                                        <use href="src/assets/icon/sprite.svg#arrow-right-icon"></use>
                                    </svg>
                                    Overview
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="projects">
                                    <svg class="icon">
                                        <use href="src/assets/icon/sprite.svg#arrow-right-icon"></use>
                                    </svg>
                                    Project
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>
        <!-- end sidebar -->
        <!-- main content -->
        <main class="editor" id="editor">
            <article class="main-content" id="main-content">
            </article>
        </main>
        <!-- end main content -->
        <footer class="footer" id="footer">
            <div class="social-links">
                <a href="#">
                    <svg class="social-icon">
                        <use href="src/assets/icon/sprite.svg#facebook-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="src/assets/icon/sprite.svg#github-icon"></use>
                    </svg>
                </a>

                <a href="#">
                    <svg class="social-icon">
                        <use href="src/assets/icon/sprite.svg#tiktok-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="src/assets/icon/sprite.svg#linkedin-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="src/assets/icon/sprite.svg#instagram-icon"></use>
                    </svg>
                </a>

            </div>
            <div class="powered">
                <span>HTML | CSS | javascript</span>
            </div>
            <div class="copyright">
                <span>©</span>
                <p>2026 Kurniawan. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>

</html>
