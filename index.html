<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kurniawan</title>

    <link rel="stylesheet" href="src/style/main.css">

</head>

<body>
    <!-- main parent -->
    <div class="main-parent" id="main-parent">
        <!-- header -->
        <header class="header" id="header">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation menu">
                <svg class="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="header-name">
                <svg class="header-icon">
                    <use href="assets/icon/sprite.svg#terminal-icon"></use>
                </svg>
                <p>DIGITAL GARDEN</p>
            </div>
            <div class="three-dots">
                <div class="green"></div>
                <div class="blue"></div>
                <div class="red"></div>
            </div>

        </header>
        <!-- end header -->
        <!-- sidebar -->
        <aside class="sidebar" id="sidebar">
            <section class="profile">
                <img src="https://avatars.githubusercontent.com/u/1103287?v=4" alt="Profile Picture"
                    class="profile-pic">
                <div class="name-n-bio">
                    <h1>KURNIAWAN</h1>
                    <span></span>
                    <p>Computer And Network Engineering student</p>
                </div>
            </section>
            <nav class="nav-bar" id="nav-bar">
                <p class="explorer">EXPLORER</p>

                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="#" data-page="home">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#home-icon"></use>
                            </svg>
                            <span>Beranda</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="#" data-page="about">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#about-icon"></use>
                            </svg>
                            <span>Tentang Saya</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="#" data-page="experience">
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#experience-icon"></use>
                            </svg>
                            <span>Pengalaman</span>
                        </a>
                    </li>
                    <li class="menu-item folder">
                        <button class="folder-btn" id="sub-menu">
                            <svg class="chevron">
                                <use href="assets/icon/sprite.svg#chevron"></use>
                            </svg>
                            <svg class="icon">
                                <use href="assets/icon/sprite.svg#projects-icon"></use>
                            </svg>
                            <span>portofolio</span>
                        </button>
                        <ul class="project-category" id="hidden-menu">
                            <li>
                                <a href="#" data-page="project">
                                    ringkasan
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="project">
                                    Web Development
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="project">
                                    Networking
                                </a>
                            </li>
                            <li>
                                <a href="#" data-page="project">
                                    Other
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>
        <!-- end sidebar -->
        <!-- main content -->
        <main class="editor" id="editor">
            <!-- <nav class="tab-bar" id="tab-bar"> -->
                <!-- build in javascript -->
            <!-- </nav> -->
            <article class="main-content" id="main-content">
                <!-- build in javascript -->
            </article>
        </main>
        <!-- end main content -->
        <footer class="footer" id="footer">
            <div class="social-links">
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#facebook-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#github-icon"></use>
                    </svg>
                </a>

                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#tiktok-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#linkedin-icon"></use>
                    </svg>
                </a>
                <a href="#">
                    <svg class="social-icon">
                        <use href="assets/icon/sprite.svg#instagram-icon"></use>
                    </svg>
                </a>

            </div>
            <div class="powered">
                <span>HTML | CSS | javascript</span>
            </div>
            <div class="copyright">
                <span>©</span>
                <p>2026 Kurniawan. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="src/js/main.js"></script>
</body>

</html>
